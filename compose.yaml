name: akubot

x-app: &app
  build: .
  image: akubot:local
  user: "${AKU_UID:-10001}:${AKU_GID:-10001}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  tmpfs:
    - /tmp:size=32m,mode=1777,noexec,nosuid
  pids_limit: 128
  logging:
    driver: local
    options:
      max-size: 5m
      max-file: "2"

services:
  bot:
    <<: *app
    restart: unless-stopped
    environment:
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      # The application validates these before it connects to Discord. Empty
      # values allow provisioning the local model before the sensitive step.
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}
      ALLOWED_GUILD_IDS: ${ALLOWED_GUILD_IDS:-}
      ALLOWED_CHANNEL_IDS: ${ALLOWED_CHANNEL_IDS:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      DATA_DIR: /data
      PERSONA_FILE: /config/persona.json
      DASHBOARD_ENABLED: "1"
      DASHBOARD_PORT: "8787"
    secrets: [discord_token]
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8765}:8787"
    volumes:
      - type: bind
        source: ${AKU_PRIVATE_DIR:?Run python scripts/setup.py first}/data
        target: /data
      - type: bind
        source: ${AKU_PRIVATE_DIR}/config/persona.json
        target: /config/persona.json
        read_only: true
    networks: [discord_outbound, model_private]
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 384m
    cpus: 1

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b}
    user: "${AKU_UID:-10001}:${AKU_GID:-10001}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - type: bind
        source: ${AKU_PRIVATE_DIR}/models
        target: /models
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    networks: [model_private]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    pids_limit: 256
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    cpus: ${OLLAMA_CPU_LIMIT:-2}
    logging:
      driver: none

  # Explicit, one-shot provisioning step. The runtime model has no internet.
  model-download:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b}
    profiles: [download]
    user: "${AKU_UID:-10001}:${AKU_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    environment:
      HOME: /tmp
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - type: bind
        source: ${AKU_PRIVATE_DIR}/models
        target: /models
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid
    networks: [discord_outbound]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        ollama serve >/dev/null 2>&1 &
        server_pid=$$!
        trap 'kill "$$server_pid" 2>/dev/null || true' EXIT INT TERM
        attempt=0
        until ollama list >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ] || ! kill -0 "$$server_pid" 2>/dev/null; then
            echo "The model downloader could not start."
            exit 1
          fi
          sleep 1
        done
        ollama pull "$$OLLAMA_MODEL"
    logging:
      driver: none

  # One-shot tools have neither Discord credentials nor external connectivity.
  tools:
    <<: *app
    profiles: [tools]
    environment:
      DATA_DIR: /data
      PERSONA_FILE: /config/persona.json
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - type: bind
        source: ${AKU_PRIVATE_DIR}/data
        target: /data
      - type: bind
        source: ${AKU_PRIVATE_DIR}/config/persona.json
        target: /config/persona.json
        read_only: true
      - type: bind
        source: ${AKU_PRIVATE_DIR}/imports
        target: /imports
        read_only: true
      - type: bind
        source: ${AKU_PRIVATE_DIR}/config/channel-policy.json
        target: /config/channel-policy.json
        read_only: true
      - type: bind
        source: ${AKU_PRIVATE_DIR}/review
        target: /review
    networks: [model_private]
    command: [--help]
    mem_limit: 384m

networks:
  discord_outbound: {}
  model_private:
    internal: true

secrets:
  discord_token:
    file: ${AKU_PRIVATE_DIR}/secrets/discord_token.txt

