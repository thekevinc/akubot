name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s training -p 'test_*.py' -v
      - name: Validate container configuration without credentials or a running daemon
        env:
          AKU_PRIVATE_DIR: /tmp/akubot-ci-private
          DISCORD_OWNER_ID: "111111111111111111"
          ALLOWED_GUILD_IDS: "222222222222222222"
        run: docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - name: Build the application container
        run: docker build --tag akubot:ci .
      - name: Check container dependencies and command entrypoint
        run: |
          docker run --rm --entrypoint python akubot:ci -c "import discord, aiohttp"
          docker run --rm akubot:ci --help

